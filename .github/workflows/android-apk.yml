name: Build Kajer Bazar APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build unit-test tasks and APK
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug

      - name: Verify APK signature and package
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5

      - name: Prepare clearly named APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Kajer-Bazar-Android.apk
          sha256sum dist/Kajer-Bazar-Android.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Kajer-Bazar-Android-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Install and launch APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -eux
            adb wait-for-device
            for attempt in $(seq 1 60); do
              BOOTED="$(adb shell getprop sys.boot_completed | tr -d '\r')"
              if [ "$BOOTED" = "1" ]; then break; fi
              sleep 5
            done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.kajerbazar.app.test
            adb shell am start -W -n com.kajerbazar.app.test/com.kajerbazar.app.MainActivity
            sleep 10
            adb shell pidof com.kajerbazar.app.test
            echo "PASS: Kajer Bazar debug APK installed and MainActivity launched successfully"
