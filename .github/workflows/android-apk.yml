name: Build Kajer Bazar APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build universal debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK signature and package
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5

      - name: Install and launch APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 300000
          disable-animations: true
          script: |
            set -e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.kajerbazar.app || true
            adb shell am start -n com.kajerbazar.app/.MainActivity
            sleep 15
            if ! adb shell pidof com.kajerbazar.app; then
              echo "App process not running after launch; recent logcat follows"
              adb logcat -d -t 3000
              exit 1
            fi
            echo "PASS: APK installed and app process remained alive for 15 seconds"

      - name: Prepare clearly named APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Kajer-Bazar-Android.apk
          sha256sum dist/Kajer-Bazar-Android.apk > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: Kajer-Bazar-Android-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
