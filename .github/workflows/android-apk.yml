name: Build Kajer Bazar APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build unit-test tasks and APK
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | head -n 8
          echo "$BADGING" | grep -q "package: name='com.kajerbazar.app'"
          echo "$BADGING" | grep -q "launchable-activity:"

      - name: Verify instrumentation tests and launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.kajerbazar.app || true
            adb shell am start -W -n com.kajerbazar.app/com.kajerbazar.app.MainActivity
            sleep 8
            adb shell pidof com.kajerbazar.app
            adb shell dumpsys activity activities | grep -E 'ResumedActivity|topResumedActivity' | grep 'com.kajerbazar.app'

      - name: Prepare clearly named APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Kajer-Bazar-Android.apk
          sha256sum dist/Kajer-Bazar-Android.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Kajer-Bazar-Android-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
