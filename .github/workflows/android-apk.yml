name: Build Kajer Bazar APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build unit-test tasks and APK
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug

      - name: Verify APK signature and package
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5

      - name: Prepare clearly named APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Kajer-Bazar-Android.apk
          sha256sum dist/Kajer-Bazar-Android.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Kajer-Bazar-Android-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Install and launch APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: yes
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: false
          script: |
            sleep 15 && adb wait-for-device && test "$(adb shell getprop sys.boot_completed | tr -d '\\r')" = "1" && adb shell cmd package list packages >/dev/null && adb install -r app/build/outputs/apk/debug/app-debug.apk && adb shell am force-stop com.kajerbazar.app.test && adb shell am start -n com.kajerbazar.app.test/com.kajerbazar.app.MainActivity && sleep 15 && adb shell pidof com.kajerbazar.app.test >/dev/null && echo "PASS: APK installed, activity launched, and app process remained alive for 15 seconds"
